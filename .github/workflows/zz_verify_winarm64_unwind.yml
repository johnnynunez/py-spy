# Verification-only workflow (fork branch). Builds py-spy master with a patched
# remoteprocess (Windows ARM64 unwinding fix) on windows-11-arm and runs the
# project's own tests, including the `unwind`-gated native test.
name: verify remoteprocess winarm64 unwind

on:
  push:
    branches: [verify-remoteprocess-winarm64]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Show resolved remoteprocess
        shell: bash
        run: |
          cargo update -p remoteprocess
          grep -n -A3 'name = "remoteprocess"' Cargo.lock
      - name: Build
        run: cargo build --release --verbose --examples
      - name: Install optional numpy dependency
        run: pip install "numpy>=2"
      - name: Test (default features)
        run: cargo test --release
      - name: Test (with native unwinding)
        run: cargo test --release --features unwind
      - name: Build Wheel
        shell: bash
        run: |
          pip install --upgrade maturin
          maturin build --release -o dist --all-features
      - name: Native unwinding check (py-spy dump --native)
        shell: bash
        run: |
          pip install dist/*.whl
          cat > native_check.py <<'EOF'
          import json, os, re, shutil, subprocess, sys, time
          target = r"""
          import time
          def key_cb_marker(v):
              x = 0
              for i in range(20000):
                  x += i
              return -v
          def outer_marker():
              end = time.time() + 60
              while time.time() < end:
                  sorted(range(2000), key=key_cb_marker)
          outer_marker()
          """
          open("target_native.py", "w").write(target)
          # Launch the real interpreter (not a venv redirector) so the PID is the Python process.
          p = subprocess.Popen([sys.executable, "target_native.py"])
          time.sleep(3)
          spy = shutil.which("py-spy")
          counts = []
          try:
              for i in range(5):
                  out = subprocess.run([spy, "dump", "--native", "--pid", str(p.pid)],
                                       capture_output=True, text=True, timeout=60)
                  print(out.stdout, out.stderr)
                  frames = [l for l in out.stdout.splitlines() if l.startswith("    ")]
                  native = [l for l in frames if re.search(r"\(\S+\.(dll|exe)\)\s*$", l)]
                  counts.append(len(native))
          finally:
              p.kill()
          res = {"native_frames_per_dump": counts, "python": sys.version}
          print(json.dumps(res))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("native frames per `py-spy dump --native`: %s\n" % counts)
          EOF
          python native_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-11-arm-patched
          path: dist
